name: build-and-test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: 构建并运行测试
        run: make CC=${{ matrix.cc }} test

      - name: 严格告警（零告警门禁）
        run: |
          make clean
          make CC=${{ matrix.cc }} \
               CFLAGS="-std=c11 -O2 -Wall -Wextra -Wpedantic -Wshadow -Wstrict-prototypes -Werror"

      - name: Sanitizer（越界 / 未定义行为）
        if: matrix.cc == 'gcc'
        run: |
          make clean
          make CC=gcc CFLAGS="-std=c11 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all"
          ./build/tests

  pipeline:
    name: 仿真链路与出图
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install numpy matplotlib

      - name: 跑完整演示链路
        run: make demo

      - name: 归档图表
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: docs/figures/
